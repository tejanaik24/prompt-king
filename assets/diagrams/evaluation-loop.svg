<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <rect width="100%" height="100%" fill="#0D0E12" rx="8" stroke="#1F2937" stroke-width="1"/>
  
  <text x="35" y="40" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#F3F4F6">EVALUATION &amp; REGRESSION TEST LOOP</text>
  <text x="35" y="55" font-family="Courier, monospace" font-size="11" fill="#9CA3AF">Fresh-context testing framework to prevent capability regression</text>

  <!-- Flow Grid -->
  <!-- Left Box: Fresh Context -->
  <g transform="translate(35, 90)">
    <rect width="140" height="180" rx="6" fill="#14151F" stroke="#374151" stroke-width="1.5"/>
    <text x="15" y="25" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#8B5CF6">TEST HARNESS</text>
    
    <rect x="15" y="50" width="110" height="40" rx="4" fill="#1F2937"/>
    <text x="25" y="68" font-family="Courier, monospace" font-size="9" fill="#F3F4F6">Fresh Subagent</text>
    <text x="25" y="80" font-family="Courier, monospace" font-size="8.5" fill="#9CA3AF">No extra docs</text>

    <rect x="15" y="100" width="110" height="40" rx="4" fill="#1F2937"/>
    <text x="25" y="118" font-family="Courier, monospace" font-size="9" fill="#F3F4F6">SKILL.md Only</text>
    <text x="25" y="130" font-family="Courier, monospace" font-size="8.5" fill="#9CA3AF">Pure context</text>
  </g>

  <!-- Arrow -->
  <path d="M 175,180 L 205,180" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="210,180 202,176 202,184" fill="#8B5CF6"/>

  <!-- Center Box: 30-Scenario Run -->
  <g transform="translate(210, 90)">
    <rect width="180" height="180" rx="6" fill="#1D1E2C" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="15" y="25" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#A78BFA">30-SCENARIO SUITE</text>
    
    <rect x="15" y="50" width="150" height="30" rx="4" fill="#1F2937"/>
    <text x="25" y="69" font-family="Courier, monospace" font-size="9.5" fill="#F3F4F6">IMAGE (1-26)</text>

    <rect x="15" y="90" width="150" height="30" rx="4" fill="#1F2937"/>
    <text x="25" y="109" font-family="Courier, monospace" font-size="9.5" fill="#F3F4F6">NEGATIVE ENGINE (27-29)</text>

    <rect x="15" y="130" width="150" height="30" rx="4" fill="#1F2937"/>
    <text x="25" y="149" font-family="Courier, monospace" font-size="9.5" fill="#F3F4F6">MULTI-TURN REPEATED (30)</text>
  </g>

  <!-- Arrow -->
  <path d="M 390,180 L 420,180" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="425,180 417,176 417,184" fill="#8B5CF6"/>

  <!-- Right Box: Verification -->
  <g transform="translate(425, 90)">
    <rect width="140" height="180" rx="6" fill="#14151F" stroke="#D946EF" stroke-width="1.5"/>
    <text x="15" y="25" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#F472B6">VERIFICATION</text>
    
    <text x="15" y="55" font-family="-apple-system, sans-serif" font-size="9.5" fill="#9CA3AF">Checks output</text>
    <text x="15" y="70" font-family="-apple-system, sans-serif" font-size="9.5" fill="#9CA3AF">against criteria</text>
    
    <rect x="15" y="100" width="110" height="50" rx="4" fill="#1B2D25" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="120" font-family="Courier, monospace" font-size="10.5" fill="#10B981">SCORE: 30/30</text>
    <text x="25" y="135" font-family="Courier, monospace" font-size="10.5" fill="#10B981">100% PASS</text>
  </g>
</svg>
