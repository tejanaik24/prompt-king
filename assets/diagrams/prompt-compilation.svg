<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <rect width="100%" height="100%" fill="#0D0E12" rx="8" stroke="#1F2937" stroke-width="1"/>
  
  <text x="35" y="40" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#F3F4F6">PROMPT COMPILATION FLOW</text>
  <text x="35" y="55" font-family="Courier, monospace" font-size="11" fill="#9CA3AF">Modular syntax parsing and structure building</text>

  <!-- Left: Raw Input -->
  <g transform="translate(35, 90)">
    <rect width="140" height="180" rx="6" fill="#14151F" stroke="#374151" stroke-width="1.5"/>
    <text x="15" y="25" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#8B5CF6">RAW INPUT</text>
    <text x="15" y="50" font-family="Courier, monospace" font-size="10.5" fill="#9CA3AF">"Minimalist poster"</text>
    <text x="15" y="70" font-family="Courier, monospace" font-size="10.5" fill="#9CA3AF">"Coffee brand"</text>
    <text x="15" y="90" font-family="Courier, monospace" font-size="10.5" fill="#9CA3AF">"Warm lighting"</text>
  </g>

  <!-- Arrow -->
  <path d="M 175,180 L 205,180" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="210,180 202,176 202,184" fill="#8B5CF6"/>

  <!-- Center: Compiler -->
  <g transform="translate(210, 90)">
    <rect width="180" height="180" rx="6" fill="#1D1E2C" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="15" y="25" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#A78BFA">COMPILER CORE</text>
    <text x="15" y="55" font-family="Courier, monospace" font-size="10" fill="#F3F4F6">- Category Selection</text>
    <text x="15" y="75" font-family="Courier, monospace" font-size="10" fill="#F3F4F6">- Command Library Match</text>
    <text x="15" y="95" font-family="Courier, monospace" font-size="10" fill="#F3F4F6">- Format Alignment</text>
    <text x="15" y="115" font-family="Courier, monospace" font-size="10" fill="#F3F4F6">- Anti-AI Rules Run</text>
    <text x="15" y="135" font-family="Courier, monospace" font-size="10" fill="#F3F4F6">- Self-Critique Loop</text>
  </g>

  <!-- Arrow -->
  <path d="M 390,180 L 420,180" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="425,180 417,176 417,184" fill="#8B5CF6"/>

  <!-- Right: Compiled Prompt -->
  <g transform="translate(425, 90)">
    <rect width="140" height="180" rx="6" fill="#14151F" stroke="#D946EF" stroke-width="1.5"/>
    <text x="15" y="25" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#F472B6">COMPILED PROMPT</text>
    
    <text x="15" y="55" font-family="-apple-system, sans-serif" font-size="9.5" fill="#9CA3AF">Subject brief</text>
    <text x="15" y="75" font-family="-apple-system, sans-serif" font-size="9.5" fill="#9CA3AF">Visual language</text>
    <text x="15" y="95" font-family="-apple-system, sans-serif" font-size="9.5" fill="#9CA3AF">Camera &amp; Lens</text>
    <text x="15" y="115" font-family="-apple-system, sans-serif" font-size="9.5" fill="#9CA3AF">Lighting grid</text>
    <text x="15" y="135" font-family="-apple-system, sans-serif" font-size="9.5" fill="#9CA3AF">Materials &amp; Texture</text>
    
    <text x="15" y="160" font-family="Courier, monospace" font-weight="bold" font-size="10.5" fill="#D946EF">OUTPUT OK</text>
  </g>
</svg>
