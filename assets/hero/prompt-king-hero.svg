<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F13"/>
      <stop offset="50%" stop-color="#14141A"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#heroGrad)"/>
  
  <!-- Technical Grid overlay for premium engineering aesthetic -->
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  <path d="M 100,0 L 100,350 M 200,0 L 200,350 M 300,0 L 300,350 M 400,0 L 400,350 M 500,0 L 500,350 M 600,0 L 600,350 M 700,0 L 700,350" stroke="#1F2937" stroke-width="0.5" opacity="0.3"/>
  
  <rect x="0" y="0" width="800" height="350" fill="url(#gridGrad)" opacity="0.4"/>

  <!-- Left: Branding & Text -->
  <g transform="translate(60, 110)">
    <!-- Crown icon small -->
    <path d="M 0,-30 L -8,-10 L 0,-15 L 8,-10 Z" fill="#8B5CF6" transform="scale(1.5)"/>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#F3F4F6" letter-spacing="2">PROMPT KING</text>
    <text x="2" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="url(#accentGrad)" letter-spacing="1.5">AGENTIC CREATIVE INTELLIGENCE</text>
    <text x="2" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" letter-spacing="0.5">High-fidelity compiler for generative image and video prompts.</text>
    
    <!-- Badges in hero -->
    <rect x="2" y="115" width="130" height="24" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="12" y="131" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#10B981">EVAL: 30/30 PASS</text>
    
    <rect x="142" y="115" width="140" height="24" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="152" y="131" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#D946EF">ENGINE: v0.2.0-LIVE</text>
  </g>

  <!-- Right: Schematic Pipeline Graphic -->
  <g transform="translate(480, 45)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="260" height="260" rx="12" fill="#111116" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="30" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#9CA3AF">COMPILER SCHEMATIC</text>
    
    <!-- Nodes -->
    <!-- Input -->
    <rect x="30" y="60" width="200" height="35" rx="6" fill="#1F2937" stroke="#8B5CF6" stroke-width="1"/>
    <text x="40" y="81" font-family="Courier, monospace" font-size="11" fill="#F3F4F6">INPUT: Ambiguous Intent</text>

    <!-- Arrow 1 -->
    <line x1="130" y1="95" x2="130" y2="120" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="130,123 126,117 134,117" fill="#8B5CF6"/>

    <!-- Processor Core -->
    <rect x="30" y="125" width="200" height="50" rx="6" fill="#8B5CF6" fill-opacity="0.1" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <text x="40" y="147" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" fill="#F3F4F6">Creative Reasoner &amp; Engine</text>
    <text x="40" y="163" font-family="Courier, monospace" font-size="10" fill="#9CA3AF">Negative Context &amp; Critique</text>

    <!-- Arrow 2 -->
    <line x1="130" y1="175" x2="130" y2="200" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="130,203 126,197 134,197" fill="#8B5CF6"/>

    <!-- Output -->
    <rect x="30" y="205" width="200" height="35" rx="6" fill="#1F2937" stroke="#D946EF" stroke-width="1"/>
    <text x="40" y="226" font-family="Courier, monospace" font-size="11" fill="#D946EF">OUTPUT: Compiled Prompt</text>
  </g>
</svg>
