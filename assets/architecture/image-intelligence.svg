<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="100%" height="100%" fill="#0D0E12" rx="10" stroke="#1F2937" stroke-width="1"/>
  
  <text x="30" y="45" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" fill="#F3F4F6">IMAGE INTELLIGENCE COMPILATION</text>
  <text x="30" y="65" font-family="Courier, monospace" font-size="12" fill="#9CA3AF">22 Taxonomy Groups &amp; System Selection</text>

  <!-- Left: Inputs -->
  <g transform="translate(30, 100)">
    <rect width="220" height="280" rx="8" fill="#14151F" stroke="#1F2937" stroke-width="1"/>
    <text x="15" y="30" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#8B5CF6">TAXONOMY GROUPS</text>
    
    <!-- List of categories -->
    <rect x="15" y="50" width="190" height="30" rx="4" fill="#1F2937"/>
    <text x="25" y="69" font-family="Courier, monospace" font-size="11" fill="#F3F4F6">1. Commercial / Ad</text>

    <rect x="15" y="90" width="190" height="30" rx="4" fill="#1F2937"/>
    <text x="25" y="109" font-family="Courier, monospace" font-size="11" fill="#F3F4F6">2. Photography / Lens</text>

    <rect x="15" y="130" width="190" height="30" rx="4" fill="#1F2937"/>
    <text x="25" y="149" font-family="Courier, monospace" font-size="11" fill="#F3F4F6">3. Graphic &amp; Poster</text>

    <rect x="15" y="170" width="190" height="30" rx="4" fill="#1F2937"/>
    <text x="25" y="189" font-family="Courier, monospace" font-size="11" fill="#F3F4F6">4. Art / Illustration</text>

    <rect x="15" y="210" width="190" height="30" rx="4" fill="#1F2937"/>
    <text x="25" y="229" font-family="Courier, monospace" font-size="11" fill="#F3F4F6">5. Print &amp; Material</text>
    
    <text x="15" y="260" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9CA3AF">+ 17 other structured categories</text>
  </g>

  <!-- Connection Arrows -->
  <g transform="translate(250, 220)">
    <line x1="10" y1="0" x2="60" y2="0" stroke="#8B5CF6" stroke-width="2"/>
    <polygon points="65,0 57,-4 57,4" fill="#8B5CF6"/>
  </g>

  <!-- Center: Compiler & Composition Engine -->
  <g transform="translate(320, 100)">
    <rect width="220" height="280" rx="8" fill="#14151F" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="15" y="30" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#8B5CF6">COMPOSITION RULES</text>
    
    <rect x="15" y="50" width="190" height="45" rx="4" fill="#1D1E2C" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
    <text x="25" y="68" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#A78BFA">PURPOSE DIRECTIVE</text>
    <text x="25" y="82" font-family="Courier, monospace" font-size="10.5" fill="#F3F4F6">Align with visual goals</text>

    <rect x="15" y="105" width="190" height="45" rx="4" fill="#1D1E2C" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
    <text x="25" y="123" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#A78BFA">ANTI-AI DIRECTIVES</text>
    <text x="25" y="137" font-family="Courier, monospace" font-size="10.5" fill="#F3F4F6">Texture, organic flaws</text>

    <rect x="15" y="160" width="190" height="45" rx="4" fill="#1D1E2C" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
    <text x="25" y="178" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#A78BFA">COMPILATION SYSTEM</text>
    <text x="25" y="192" font-family="Courier, monospace" font-size="10.5" fill="#F3F4F6">Builds structured grid</text>

    <text x="15" y="240" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">Translates abstract inputs to</text>
    <text x="15" y="255" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">exact camera/format settings</text>
  </g>

  <!-- Connection Arrows -->
  <g transform="translate(540, 220)">
    <line x1="10" y1="0" x2="60" y2="0" stroke="#8B5CF6" stroke-width="2"/>
    <polygon points="65,0 57,-4 57,4" fill="#8B5CF6"/>
  </g>

  <!-- Right: Generated Structured Prompt Output -->
  <g transform="translate(610, 100)">
    <rect width="160" height="280" rx="8" fill="#14151F" stroke="#D946EF" stroke-width="1"/>
    <text x="15" y="30" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" fill="#D946EF">OUTPUT FORMAT</text>
    
    <text x="15" y="60" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9CA3AF">1. Visual Type</text>
    <line x1="15" y1="70" x2="145" y2="70" stroke="#1F2937" stroke-width="1"/>
    
    <text x="15" y="90" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9CA3AF">2. Purpose brief</text>
    <line x1="15" y1="100" x2="145" y2="100" stroke="#1F2937" stroke-width="1"/>

    <text x="15" y="120" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9CA3AF">3. Selected Commands</text>
    <line x1="15" y1="130" x2="145" y2="130" stroke="#1F2937" stroke-width="1"/>

    <text x="15" y="150" font-family="-apple-system, sans-serif" font-size="10.5" fill="#F3F4F6">4. Compiled Prompt</text>
    <line x1="15" y1="160" x2="145" y2="160" stroke="#D946EF" stroke-width="1"/>

    <text x="15" y="180" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9CA3AF">5. Aspect Ratio</text>
    <line x1="15" y1="190" x2="145" y2="190" stroke="#1F2937" stroke-width="1"/>

    <text x="15" y="210" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9CA3AF">6. Avoid List (NEG-V1)</text>
    
    <rect x="15" y="235" width="130" height="30" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="25" y="254" font-family="Courier, monospace" font-size="10.5" fill="#D946EF">PRODUCTION-READY</text>
  </g>
</svg>
